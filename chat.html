<!DOCTYPE html><html><head><meta charset="utf-8"><title>Track 2 Agent Chat</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;max-width:800px;margin:24px auto;padding:0 16px;background:#0f172a;color:#e2e8f0}
#log{background:#1e293b;border-radius:10px;padding:16px;min-height:300px;max-height:60vh;overflow:auto;scrollbar-width:thin;scrollbar-color:#38bdf8 #0b1220}
#log::-webkit-scrollbar{width:8px}#log::-webkit-scrollbar-track{background:#0b1220;border-radius:8px}#log::-webkit-scrollbar-thumb{background:#334155;border-radius:8px}#log::-webkit-scrollbar-thumb:hover{background:#38bdf8}
.u{text-align:right;margin:8px 0}.u span{background:#1d4ed8;border-radius:12px;padding:6px 12px;display:inline-block}
.u .edit{font-size:11px;color:#93c5fd;cursor:pointer;margin-right:6px;opacity:0}.u:hover .edit{opacity:1}
.u input{background:#0b1220;color:#e2e8f0;border:1px solid #38bdf8;border-radius:8px;padding:5px 10px;width:70%}
.a{background:#020617;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:15px;line-height:1.6}
.a h4{margin:10px 0 4px}.a ul{margin:4px 0;padding-left:22px}.a li{margin:2px 0}
details{margin-top:8px;font-size:13px;color:#94a3b8}summary{cursor:pointer;color:#38bdf8}
.ev{border-left:3px solid #38bdf8;padding-left:8px;margin:6px 0}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.meta{font-size:11px;color:#94a3b8;margin-top:8px}
#row{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#020617;color:#e2e8f0}
button{padding:10px 18px;border-radius:8px;border:0;background:#2563eb;color:#fff;cursor:pointer}button:disabled{background:#475569}
code{background:#1e293b;padding:1px 6px;border-radius:5px;font-size:13px}</style>
</head><body><h2>Track 2 Agent Chat</h2>
<div id="log"></div>
<div id="row"><input id="q" placeholder="Ask, e.g. Should we adopt React or Vue?"><button id="go" onclick="send()">Send</button></div>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),go=document.getElementById('go');
q.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
function md(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/^### (.*)$/gm,'<h4>$1</h4>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .split('\n').map(l=>/^\s*[-*] /.test(l)?'<li>'+l.replace(/^\s*[-*] /,'')+'</li>':l).join('\n')
    .replace(/((<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>').replace(/\n/g,'<br>');
}
async function send(textOverride){
  const text=(textOverride!==undefined?textOverride:q.value).trim();if(!text)return;
  q.value='';go.disabled=true;
  const t0=Date.now();
  const qid='q'+t0;
  log.innerHTML+='<div class=u id='+qid+'><span class=edit onclick="editMsg(\''+qid+'\')">edit</span><span class=txt>'+text.replace(/</g,'&lt;')+'</span></div><div class=a id=tmp><span class=spin></span><span id=timer>Agent is investigating across Zetaris sources… 0s</span></div>';
  log.scrollTop=log.scrollHeight;
  const tick=setInterval(()=>{const el=document.getElementById('timer');if(el)el.textContent='Agent is investigating across Zetaris sources… '+Math.floor((Date.now()-t0)/1000)+'s';},500);
  try{
    const r=await fetch('http://localhost:8000/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:'chat-'+Date.now(),user_query:text})});
    const d=await r.json();
    document.getElementById('tmp').remove();
    const ev=(d.result.findings||[]).map(f=>'<div class=ev><b>'+f.rows_seen+' rows</b> — <code>'+f.claim.replace(/</g,'&lt;')+'</code><br>sources: '+f.sources.join(', ')+'</div>').join('');
    log.innerHTML+='<div class=a>'+md(d.result.summary)+
      '<details><summary>Evidence queries ('+(d.result.findings||[]).length+' sources, click to expand)</summary>'+ev+'</details>'+
      '<details><summary>Agent trace</summary><div class=meta>agents: '+d.agents_used.join(' → ')+' | live: '+d.zetaris_live+' | confidence: '+d.result.confidence+' | revisions: '+d.collaboration.revision_count+' | model: '+(d.ai_provider?d.ai_provider.mode+' / '+d.ai_provider.model:'n/a')+'<br>'+d.log_path+'</div></details></div>';
  }catch(e){document.getElementById('tmp').innerHTML='Error: '+e+' (is the server on :8000 running?)';}
  clearInterval(tick);go.disabled=false;log.scrollTop=log.scrollHeight;
}
function editMsg(qid){
  const box=document.getElementById(qid);if(!box||box.querySelector('input'))return;
  const txt=box.querySelector('.txt').textContent;
  box.querySelector('.txt').outerHTML='<input id='+qid+'-in value="'+txt.replace(/"/g,'&quot;')+'">';
  const inp=document.getElementById(qid+'-in');inp.focus();inp.select();
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const nt=inp.value.trim()||txt;
      let ans=box.nextElementSibling;
      const nodes=[box];while(ans&&!ans.classList.contains('u')){nodes.push(ans);ans=ans.nextElementSibling;}
      nodes.forEach(n=>n.remove());
      send(nt);
    }
    if(e.key==='Escape'){inp.outerHTML='<span class=txt>'+txt.replace(/</g,'&lt;')+'</span>';}
  });
}
</script></body></html>
