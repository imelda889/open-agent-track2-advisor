<!DOCTYPE html><html><head><meta charset="utf-8"><title>Track 2 Agent Chat</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
#app{display:flex;min-height:100vh}
#side{width:250px;background:#0b1220;padding:16px 12px;flex-shrink:0}
#side h3{font-size:13px;color:#94a3b8;margin:4px 6px 10px;letter-spacing:1px}
.hist{font-size:14px;padding:9px 12px;border-radius:10px;cursor:pointer;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist:hover{background:#1e293b}.hist small{color:#64748b;display:block}
#main{flex:1;max-width:1080px;margin:0 auto;padding:28px 28px;width:100%}
#main h2{font-size:28px;margin:4px 0 14px}
#log{background:#1e293b;border-radius:14px;padding:20px;min-height:46vh;max-height:66vh;overflow:auto;font-size:17px;scrollbar-width:thin;scrollbar-color:#38bdf8 #0b1220}
#log::-webkit-scrollbar{width:8px}#log::-webkit-scrollbar-track{background:#0b1220;border-radius:8px}#log::-webkit-scrollbar-thumb{background:#334155;border-radius:8px}#log::-webkit-scrollbar-thumb:hover{background:#38bdf8}
.u{text-align:right;margin:8px 0}.u span{background:#1d4ed8;border-radius:12px;padding:6px 12px;display:inline-block}
.u .edit{font-size:11px;color:#93c5fd;cursor:pointer;margin-right:6px;opacity:0}.u:hover .edit{opacity:1}
.u input{background:#0b1220;color:#e2e8f0;border:1px solid #38bdf8;border-radius:8px;padding:5px 10px;width:70%}
.a{background:#020617;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:15px;line-height:1.6}
.a h4{margin:10px 0 4px}.a ul{margin:4px 0;padding-left:22px}.a li{margin:2px 0}
details{margin-top:8px;font-size:13px;color:#94a3b8}summary{cursor:pointer;color:#38bdf8}
.ev{border-left:3px solid #38bdf8;padding-left:8px;margin:6px 0}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.meta{font-size:11px;color:#94a3b8;margin-top:8px}
.acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.acts button{font-size:13px;padding:6px 14px;background:#0b1220;color:#cbd5e1;border:1px solid #334155;border-radius:999px;cursor:pointer;transition:border-color .15s,background .15s}
.acts button:hover{border-color:#38bdf8;background:#1e293b}
.acts button.done{background:#065f46;border-color:#065f46;color:#fff}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.chips button{font-size:14px;background:linear-gradient(180deg,#1e293b,#0f172a);border:1px solid #334155;color:#bae6fd;border-radius:999px;padding:9px 16px;cursor:pointer;transition:border-color .15s,transform .15s}
.chips button:hover{border-color:#38bdf8;transform:translateY(-1px)}
.chips button::before{content:'✨ ';}
#row{display:flex;gap:8px;margin-top:12px}input#q{flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#020617;color:#e2e8f0}
button#go{padding:10px 18px;border-radius:8px;border:0;background:#2563eb;color:#fff;cursor:pointer}button#go:disabled{background:#475569}
code{background:#1e293b;padding:1px 6px;border-radius:5px;font-size:13px}</style>
</head><body><div id="app">
<div id="side"><h3>HISTORY</h3><div id="hist"></div></div>
<div id="main"><h2>Track 2 Agent Chat</h2>
<div class="chips" id="suggest"></div>
<div id="log"></div>
<div id="row"><input id="q" placeholder="Ask, e.g. Should we adopt React or Vue?"><button id="go" onclick="send()">Send</button></div>
</div></div>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),go=document.getElementById('go');
q.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
const SUGGEST=['Should we adopt React or Vue for a new web project?','Which Pokemon has the highest base stats and why?','Compare npm download counts of react and vue with evidence'];
document.getElementById('suggest').innerHTML=SUGGEST.map((s,i)=>'<button onclick="send('+i+',true)">'+s+'</button>').join('');
function followups(text,findings){
  const t=text.toLowerCase(),out=[];
  const has=(w)=>t.includes(w);
  if(has('react')||has('vue')||has('framework')||has('library')){out.push('What does the evidence not cover?','Which has fewer open issues per star?','What about Vue 3 (vuejs/core)?');}
  else if(has('pokemon')||has('stat')){out.push('Which Pokemon has more types?','Show the full stat table');}
  else{out.push('What evidence is this based on?','How confident is this answer?');}
  if(findings&&findings.length)out.push('Show me the raw rows');
  return out.slice(0,3);
}
function md(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/^### (.*)$/gm,'<h4>$1</h4>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .split('\n').map(l=>/^\s*[-*] /.test(l)?'<li>'+l.replace(/^\s*[-*] /,'')+'</li>':l).join('\n')
    .replace(/((<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>').replace(/\n/g,'<br>');
}
function saveHist(entry){
  try{const h=JSON.parse(localStorage.getItem('track2-history')||'[]');h.unshift(entry);localStorage.setItem('track2-history',JSON.stringify(h.slice(0,20)));renderHist();}catch(e){}
}
function renderHist(){
  let h=[];try{h=JSON.parse(localStorage.getItem('track2-history')||'[]')}catch(e){}
  document.getElementById('hist').innerHTML=h.map((e,i)=>'<div class=hist onclick="recallHist('+i+')">'+e.q.replace(/</g,'&lt;')+'<small>'+new Date(e.t).toLocaleString()+'</small></div>').join('')||'<div class=hist>no chats yet</div>';
}
function recallHist(i){
  let h=[];try{h=JSON.parse(localStorage.getItem('track2-history')||'[]')}catch(e){}
  const e=h[i];if(!e)return;
  log.innerHTML='<div class=u><span>'+e.q.replace(/</g,'&lt;')+'</span></div><div class=a>'+e.html+'<div class=meta>restored from history · '+new Date(e.t).toLocaleString()+'</div></div>';
}
function copyAns(id){const el=document.getElementById(id);if(!el)return;navigator.clipboard.writeText(el.innerText).then(()=>{const b=document.getElementById(id+'-cp');if(b){b.textContent='copied ✓';setTimeout(()=>b.textContent='copy',1500);}});}
async function fb(traceQ,helpful,btn){
  try{await fetch('http://localhost:8000/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_query:traceQ,helpful:helpful})});btn.textContent=helpful?'👍 recorded → memory':'👎 recorded → memory';btn.classList.add('done');}catch(e){btn.textContent='failed';}
}
async function send(si,useSuggest){
  const text=(si!==undefined?(useSuggest?SUGGEST[si]:si):q.value).trim();if(!text)return;
  q.value='';go.disabled=true;
  const t0=Date.now(),qid='q'+t0;
  log.innerHTML+='<div class=u id='+qid+'><span class=edit onclick="editMsg(\''+qid+'\')">edit</span><span class=txt>'+text.replace(/</g,'&lt;')+'</span></div><div class=a id=tmp><span class=spin></span><span id=timer>Agent is investigating across Zetaris sources… 0s</span></div>';
  log.scrollTop=log.scrollHeight;
  const tick=setInterval(()=>{const el=document.getElementById('timer');if(el)el.textContent='Agent is investigating across Zetaris sources… '+Math.floor((Date.now()-t0)/1000)+'s';},500);
  try{
    const r=await fetch('http://localhost:8000/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:'chat-'+t0,user_query:text})});
    const d=await r.json();
    clearInterval(tick);
    const secs=((d.elapsed_ms||(Date.now()-t0))/1000).toFixed(1);
    document.getElementById('tmp').remove();
    const ev=(d.result.findings||[]).map(f=>'<div class=ev><b>'+f.rows_seen+' rows</b> — <code>'+f.claim.replace(/</g,'&lt;')+'</code><br>sources: '+f.sources.join(', ')+'</div>').join('');
    const aid='a'+t0;
    const fups=followups(text,d.result.findings).map(f=>'<button onclick="send(\''+f.replace(/'/g,"\\'")+'\')">'+f.replace(/</g,'&lt;')+'</button>').join('');
    log.innerHTML+='<div class=a id='+aid+'>'+md(d.result.summary)+
      '<div class=acts><button id='+aid+'-cp onclick="copyAns(\''+aid+'-body\')">copy</button>'+
      '<button onclick="send(\''+text.replace(/'/g,"\\'")+'\')">↻ regenerate</button>'+
      '<button onclick="fb(\''+text.replace(/'/g,"\\'")+'\',true,this)">👍</button>'+
      '<button onclick="fb(\''+text.replace(/'/g,"\\'")+'\',false,this)">👎</button></div>'+
      '<div id='+aid+'-body style=display:none>'+md(d.result.summary).replace(/"/g,'&quot;')+'</div>'+
      '<details><summary>Thought for '+secs+'s — '+(d.agents_used||[]).join(' → ')+'</summary><div class=meta>planner → retriever → summarizer → critic → report · revisions: '+d.collaboration.revision_count+' · confidence: '+d.result.confidence+' · model: '+(d.ai_provider?d.ai_provider.mode+' / '+d.ai_provider.model:'n/a')+'</div></details>'+
      '<details><summary>Evidence queries ('+(d.result.findings||[]).length+' sources, click to expand)</summary>'+ev+'</details>'+
      '<details><summary>Agent trace</summary><div class=meta>'+d.log_path+'</div></details>'+
      '<div class=chips>'+fups+'</div></div>';
    saveHist({q:text,t:t0,html:document.querySelector('#'+aid).innerHTML});
  }catch(e){clearInterval(tick);document.getElementById('tmp').innerHTML='Error: '+e+' (is the server on :8000 running?)';}
  go.disabled=false;log.scrollTop=log.scrollHeight;
}
function editMsg(qid){
  const box=document.getElementById(qid);if(!box||box.querySelector('input'))return;
  const txt=box.querySelector('.txt').textContent;
  box.querySelector('.txt').outerHTML='<input id='+qid+'-in value="'+txt.replace(/"/g,'&quot;')+'">';
  const inp=document.getElementById(qid+'-in');inp.focus();inp.select();
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const nt=inp.value.trim()||txt;
      let ans=box.nextElementSibling;
      const nodes=[box];while(ans&&!ans.classList.contains('u')){nodes.push(ans);ans=ans.nextElementSibling;}
      nodes.forEach(n=>n.remove());
      send(nt);
    }
    if(e.key==='Escape'){inp.outerHTML='<span class=txt>'+txt.replace(/</g,'&lt;')+'</span>';}
  });
}
renderHist();
</script></body></html>
