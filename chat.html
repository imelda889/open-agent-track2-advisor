</style></head><body><div id="app">

<script>
const feed=document.getElementById('feed'),q=document.getElementById('q'),go=document.getElementById('go');
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
const TABLES=['advisor.all_repo_health_table','advisor.all_downloads_table','pokeapi.all_pokemon_stats_table','pokeapi.all_pokemon_types_table'];
document.getElementById('schema').innerHTML='<span class="lbl" style="font-size:11px;color:#64748b">Tables:</span>'+TABLES.map(t=>'<span class="tchip" onclick="q.value+=(q.value?\' \':\'\')+\''+t+'\';q.focus()">'+t+'</span>').join('');
const SUGGEST=['Should we adopt React or Vue for a new web project?','Which Pokemon has the highest base stats and why?','Compare npm download counts of react and vue with evidence'];
let aborter=null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function md(t){
  t=String(t).replace(/<\/?think>/g,'').replace(/<think>[\s\S]*?<\/think>/g,'');
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const lines=t.split('\n');let out='',inth=false;
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(const l of lines){
    if(/^\s*\|.*\|\s*$/.test(l)){
      if(!inth){out+='<table class=dt>';inth=true;}
      const cells=l.split('|').filter(c=>c.trim()!=='');
      if(/^[\s:-]+$/.test(cells.join(''))){continue;}
      out+='<tr>'+cells.map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>';
      continue;
    } else if(inth){out+='</table>';inth=false;}
    if(/^### (.*)$/.test(l)){out+='<h4>'+inline(l.replace(/^### /,''))+'</h4>';continue;}
    if(/^\s*[-*] /.test(l)){out+='<liitem>'+inline(l.replace(/^\s*[-*] /,''))+'</liitem>';continue;}
    if(l.trim()===''){continue;}
    out+='<p style="margin:6px 0">'+inline(l)+'</p>';
  }
  if(inth)out+='</table>';
  return out.replace(/((<liitem>.*<\/liitem>)+)/g,'<ul>$1</ul>').replace(/<\/?liitem>/g,m=>m.startsWith('</')?'</li>':'<li>');
}
function normRow(r,cols){

async function send(preset){
  const curT0=CUR&&TASKS[CUR];
  if(go.dataset.busy==='1'&&curT0&&!curT0.done){if(curT0.aborter)curT0.aborter.abort();return;}
  const text=(preset!==undefined?preset:q.value).trim();if(!text)return;
  q.value='';
  if(!window.__asked){
    window.__asked=true;
    const KEYW=/react|vue|framework|librar|adopt|npm|github|star|download|pokemon|pikachu|charizard|stat|type|taxi|trip|demand|sale|store|retail|customer|order/i;
    if(!KEYW.test(text)){
      feed.innerHTML+='<div class=u><div class=b><span>'+text.replace(/</g,'&lt;')+'</span></div></div><div class=arow><div class=abody><div><b>Which data should I use?</b> <span class=meta>pick one to continue</span></div><div class=clar>'+CLARIFY.map(c=>'<button onclick="send(\''+c.q.replace(/'/g,"\\'")+'\')">'+c.t+'<small>'+c.d+'</small></button>').join('')+'</div></div></div>';
      go.dataset.busy='';go.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>';go.classList.remove('stop');
      document.getElementById('log').scrollTop=1e9;
      return;
    }
  }
  const t0=Date.now(),qid='q'+t0;
  const plan=planPreview(text);
  const reqId='chat-'+t0;
  const ab=new AbortController();
  TASKS[reqId]={reqId:reqId,q:text,t0:t0,plan:plan,done:false,livePhase:-1,liveDetail:'',aborter:ab,html:'',aid:''};
  CUR=reqId;
  feed.innerHTML+='<div class=u><div class=b><span style="font-size:11px;color:#93c5fd;cursor:pointer;margin-right:8px" onclick="editMsg(\''+qid+'\')" title="Edit and resend"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span><span class=txt id='+qid+'-t>'+text.replace(/</g,'&lt;')+'</span><div style="font-size:10px;color:#93c5fd;opacity:.7;margin-top:4px;text-align:left">'+new Date(t0).toLocaleString()+'</div></div></div>'+thinkBox(reqId,plan);
  document.getElementById('log').scrollTop=1e9;
  renderHist();refreshGo();
  const tick=setInterval(()=>{paintThink(reqId,t0);const t=TASKS[reqId];if(!t||t.done)clearInterval(tick);},500);
  const poll=setInterval(async()=>{const t=TASKS[reqId];if(!t||t.done){clearInterval(poll);return;}try{const pr=await fetch('http://localhost:8000/progress?request_id='+encodeURIComponent(reqId));if(!pr.ok)return;const pj=await pr.json();const order={planning:0,recall:1,querying:1,critic:2,writing:3,done:3,error:3};if(pj.phase in order)t.livePhase=order[pj.phase];if(pj.detail)t.liveDetail=pj.detail;}catch(e){}},1000);
  try{
    document.getElementById('starter').style.display='none';
    const r=await fetch('http://localhost:8000/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:reqId,user_query:text}),signal:ab.signal});
    const d=await r.json();
    if(!r.ok||!d.result)throw new Error((d&&(d.message||d.error))||('Server error HTTP '+r.status));
    clearInterval(tick);clearInterval(poll);
    const secs=((d.elapsed_ms||(Date.now()-t0))/1000).toFixed(1);
    const aid='a'+t0;
    const findings=d.result.findings||[];
    RCACHE[aid]={d:d,findings:findings};
    const liveN=findings.filter(f=>f.live).length;
    const modelLine=d.ai_provider?d.ai_provider.mode+' / '+d.ai_provider.model:'n/a';
    const thoughtSteps=findings.map((f,i)=>'<div class=meta style="margin:6px 0 2px"><b>Retriever</b> · <code>'+esc(f.sql)+'</code> — '+f.rows_seen+' rows in '+(f.query_ms||0)+'ms '+(f.live?'<span class=n>live</span>':'<span class=n>sample</span>')+' <button class=mini-b onclick="copySqlTxt(\''+aid+'-sq'+i+'\',this)">copy SQL</button><span id='+aid+'-sq'+i+' style="display:none">'+esc(f.sql)+'</span></div>').join('');
    const thought='<details class=sql style="margin-top:10px"><summary>✓ done in '+secs+'s · '+liveN+'/'+findings.length+' live · confidence '+d.result.confidence+' <span style="color:#38bdf8;margin-left:4px">› view evidence, queries & checks</span></summary>'+
      '<div class=meta>Planner → split into '+findings.length+' Zetaris queries · recalled H-MEM context</div>'+thoughtSteps+
      '<div class=meta>Critic: '+((d.collaboration&&d.collaboration.revision_count>0)?('requested revision ×'+d.collaboration.revision_count):'approved')+' · ReportWriter: '+modelLine+'</div>'+
      '<div style="margin-top:6px"><button class=mini-b onclick="fb(\''+text.replace(/'/g,"\\'")+'\',false,this)">Report wrong answer</button></div></details>';
    const cards=findings.map((f,i)=>{
      return '<div class=card><div class=cardhead>'+esc(f.sources[0])+' <span class=n>'+f.rows_seen+' rows · '+(f.query_ms||0)+'ms · '+(f.live?'live':'sample')+'</span>'+
      '<button class=mini-b onclick="openCanvas(\''+aid+'\','+i+')" title="Open in side canvas">Open in canvas ⤢</button>'+
      '<button class=mini-b onclick="dlCSV(\'evidence-'+t0+'-'+i+'.csv\',\''+toCSV([f]).replace(/'/g,"\\'").replace(/\n/g,'\\n')+'\')">Export CSV</button></div>'+
      '<div style="padding:4px 12px 12px"><div class=vtabs style="align-items:center"><span class=meta style="margin-right:2px">View:</span><button class=on onclick="vtab(this,0)">Chart</button><button onclick="vtab(this,1)">Table</button></div>'+
      '<div class=vpane style="display:block;padding-top:8px"><div id='+aid+'-ch-'+i+'>'+svgChart(f,aid,i,aid+'-ch-'+i)+'</div></div>'+
      '<div class=vpane style="display:none;padding-top:8px"><div id='+aid+'-tbl-'+i+'>'+tblHTML(f,aid,i,aid)+'</div></div></div></div>';
    }).join('');
    const fups=followups(text,d.result.findings).map(f=>'<button onclick="send(\''+f.replace(/'/g,"\\'")+'\')">'+f.replace(/</g,'&lt;')+'</button>').join('');
    const ansHtml='<div class=arow id='+aid+'><div class=aico>AI</div><div class=abody>'+
      '<div class=ameta>Advisor <span>'+secs+'s · '+d.result.confidence+' confidence · '+modelLine+'</span></div>'+
      '<div class=ans id='+aid+'-body>'+md(d.result.summary)+'</div>'+
      thought+cards+
      '<div class=actrow><button onclick="copyTxt(\''+aid+'-body\',this)" title="Copy answer">Copy</button>'+
      '<button onclick="send(\''+text.replace(/'/g,"\\'")+'\')" title="Regenerate">Retry</button>'+
      '<button onclick="fb(\''+text.replace(/'/g,"\\'")+'\',true,this)" title="Good answer">Good</button>'+
      '<button onclick="fb(\''+text.replace(/'/g,"\\'")+'\',false,this)" title="Bad answer">Bad</button>'+
      '<button onclick="openCanvas(\''+aid+'\,'+(findings.length?0:0)+')" title="Open in side canvas">Open in canvas ⤢</button></div>'+
      '<div class=chips>'+fups+'</div></div></div>';
    const tDone=TASKS[reqId];
    if(tDone){tDone.done=true;tDone.html=ansHtml;tDone.aid=aid;}
    saveHist({q:text,t:t0,html:ansHtml});
    const tmp0=document.getElementById('tmp-'+reqId);if(tmp0)tmp0.remove();
    if(!CUR||CUR===reqId){CUR=reqId;feed.innerHTML+=ansHtml;}
    renderHist();refreshGo();
    try{document.getElementById('hmodel').textContent=d.ai_provider?d.ai_provider.model.split('/').pop():'auto';}catch(e){}
  }catch(e){
    clearInterval(tick);clearInterval(poll);
    const tErr=TASKS[reqId];
    const msg=e.name==='AbortError'?'Stopped by user.':('Error: '+((e&&e.message)||e)+' — is the server on :8000 running?');
    const errHtml='<div class=arow><div class=abody><div class=ameta>Error</div><div>'+esc(String(msg))+'</div></div></div>';
    if(tErr){tErr.done=true;tErr.html=errHtml;}
    const tmp=document.getElementById('tmp-'+reqId);
    if(tmp)tmp.querySelector('.abody').innerHTML=msg;
    else if(!CUR||CUR===reqId){feed.innerHTML+=errHtml;}
    renderHist();
  }
  refreshGo();
  document.getElementById('log').scrollTop=1e9;
}
function editMsg(qid){
  const box=document.querySelector('#'+qid+' .txt');if(!box||box.querySelector('input'))return;
  const txt=box.textContent;
  box.outerHTML='<input id='+qid+'-in value="'+txt.replace(/"/g,'&quot;')+'" style="width:70%">';
  const inp=document.getElementById(qid+'-in');inp.focus();inp.select();
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const nt=inp.value.trim()||txt;let ans=box.closest('.u');let n=ans.nextElementSibling;const rm=[ans];while(n&&!n.classList.contains('u')){rm.push(n);n=n.nextElementSibling;}rm.forEach(x=>x.remove());send(nt);}
    if(e.key==='Escape'){inp.outerHTML='<span class=txt>'+txt.replace(/</g,'&lt;')+'</span>';}
  });
}
feed.innerHTML='';
document.getElementById('starter').innerHTML=SUGGEST.map(s=>'<button onclick="send(\''+s.replace(/'/g,"\\'")+'\')">'+s+'</button>').join('');
renderHist();
refreshGo();
document.getElementById('log').addEventListener('scroll',function(){
  const atBottom=this.scrollHeight-this.scrollTop-this.clientHeight<200;
  document.getElementById('jumpLatest').classList.toggle('show',!atBottom);
});
</script></body></html>
